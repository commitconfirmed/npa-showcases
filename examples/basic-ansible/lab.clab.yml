# A Basic Ansible lab
name: lab

mgmt:
  network: management
  ipv4-subnet: 172.20.0.0/24

topology:
  nodes:
    # Ansible
    ansible:
      kind: linux
      image: lab-ansible:latest
      mgmt-ipv4: 172.20.0.100
      binds:
        - configs/lab-ansible/inventory:/app/inventory:rw
        - configs/lab-ansible/playbooks:/app/playbooks:rw
    # Network Devices  
    crpd1:
      kind: juniper_crpd
      image: crpd:latest
      mgmt-ipv4: 172.20.0.11
    ceos1:
      kind: arista_ceos
      image: ceos:latest
      mgmt-ipv4: 172.20.0.12
      env:
        CLAB_MGMT_VRF: MGMT

  links:
    - endpoints: ["crpd1:eth1", "ceos1:eth1"]