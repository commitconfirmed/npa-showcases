# A Basic cEOS CLOS lab
name: lab

mgmt:
  network: management
  ipv4-subnet: 172.20.0.0/24

topology:
  nodes:
  ### Management and Telemetry servers ###
    ansible:
      kind: linux
      image: lab-ansible:latest
      mgmt-ipv4: 172.20.0.20
      binds:
        - configs/ansible/inventory:/app/inventory:ro
        - configs/ansible/pb-cfg-lab.yml:/app/pb-cfg-lab.yml:ro
        - configs/ansible/roles:/app/roles:ro
  ### Spines ###
    spine1:
      kind: arista_ceos
      image: ceos:latest
      mgmt-ipv4: 172.20.0.201
      env:
        CLAB_MGMT_VRF: MGMT
    spine2:
      kind: arista_ceos
      image: ceos:latest
      mgmt-ipv4: 172.20.0.202
      env:
        CLAB_MGMT_VRF: MGMT  
  ### Leafs ###
    leaf1:
      kind: arista_ceos
      image: ceos:latest
      mgmt-ipv4: 172.20.0.211
      env:
        CLAB_MGMT_VRF: MGMT
    leaf2:
      kind: arista_ceos
      image: ceos:latest
      mgmt-ipv4: 172.20.0.212
      env:
        CLAB_MGMT_VRF: MGMT
    leaf3:
      kind: arista_ceos
      image: ceos:latest
      mgmt-ipv4: 172.20.0.213
      env:
        CLAB_MGMT_VRF: MGMT
    leaf4:
      kind: arista_ceos
      image: ceos:latest
      mgmt-ipv4: 172.20.0.214
      env:
        CLAB_MGMT_VRF: MGMT
  ### Hosts ###
    host1:
      kind: linux
      image: lab-host:latest
      mgmt-ipv4: 172.20.0.111
      binds:
        - configs/host/cfg-bond0.sh:/app/cfg-bond0.sh:ro
      exec:
        - "/bin/bash /app/cfg-bond0.sh 100"
        - "ip addr add 192.168.100.10/24 dev bond0.100"
    host2:
      kind: linux
      image: lab-host:latest
      mgmt-ipv4: 172.20.0.112
      binds:
        - configs/host/cfg-bond0.sh:/app/cfg-bond0.sh:ro
      exec:
        - "/bin/bash /app/cfg-bond0.sh 100"
        - "ip addr add 192.168.100.20/24 dev bond0.100"

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]
    - endpoints: ["host1:eth1", "leaf1:eth5"]
    - endpoints: ["host1:eth2", "leaf2:eth5"]
    - endpoints: ["host2:eth1", "leaf3:eth5"]
    - endpoints: ["host2:eth2", "leaf4:eth5"]